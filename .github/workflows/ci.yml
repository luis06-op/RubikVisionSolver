name: Calidad multiplataforma

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Comprobar sintaxis y tipado
        run: |
          ruff check .
          mypy

      - name: Pruebas sin cámara
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  web:
    name: Estudio web · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos y animación
        run: |
          npm run typecheck
          npm test

      - name: Compilar para Vercel
        run: npm run build
